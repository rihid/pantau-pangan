# Pantau Pangan — production stack (Docker Compose)
#
#   docker compose up -d --build        # build + start semua service
#   docker compose ps                   # cek status
#
# Konfigurasi rahasia diambil dari deploy/.env (template: deploy/.env.example).
# Database history (sejak Mei/Juni) dipindahkan via deploy/scripts/restore-db.sh.

name: pantau-pangan

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
    image: pantau-pangan/api:latest
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      # URL internal via service name `db` (bukan host)
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      API_PORT: 3001
      GENERALCOMPUTE_API_KEY: ${GENERALCOMPUTE_API_KEY}
      GENERALCOMPUTE_MODEL: ${GENERALCOMPUTE_MODEL}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL}
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "const r = await fetch('http://127.0.0.1:3001/'); process.exit(r.ok ? 0 : 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    # Scheduler scraper (07/11/15 WIB) berjalan di dalam proses API ini.

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    image: pantau-pangan/web:latest
    # Next.js standalone server bind ke process.env.HOSTNAME — Docker mengisi
    # HOSTNAME dengan container ID, sehingga server tidak listen di 127.0.0.1
    # dan healthcheck gagal. Paksa bind ke semua interface.
    environment:
      HOSTNAME: '0.0.0.0'
    restart: unless-stopped
    init: true
    depends_on:
      - api
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - web
      - api
    ports:
      - '${NGINX_HTTP_PORT:-80}:80'
      - '${NGINX_HTTPS_PORT:-443}:443'
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/']
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s

  # One-shot migration (tidak ikut `up` normal):
  #   docker compose --profile tools run --rm migrate
  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: migrate
    profiles: ['tools']
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

  # One-shot Let's Encrypt (tidak ikut `up` normal):
  #   docker compose --profile tools run --rm certbot certonly \
  #     --webroot -w /var/www/certbot -d ${DOMAIN} -d www.${DOMAIN}
  # Renewal: docker compose --profile tools run --rm certbot renew
  certbot:
    image: certbot/certbot
    profiles: ['tools']
    depends_on:
      - nginx
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt

volumes:
  pgdata:
  certbot-webroot:
  certbot-certs:
