# Pantau Pangan — nginx reverse proxy (HTTP).
# Berfungsi langsung untuk akses via IP maupun domain.
# API di-proxy di bawah path /api (same-origin, tanpa masalah CORS).

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # Let's Encrypt webroot — dipakai certbot saat aktivasi SSL
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # API — prefix /api/ di-strip, diteruskan ke container api
    location /api/ {
        proxy_pass http://api:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Web — Next.js
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}